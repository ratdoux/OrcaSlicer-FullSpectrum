name: Sanitizer Tests (ASan + UBSan)

# Disabled by default to avoid running the expensive ASan/UBSan matrix on every
# push and PR. Trigger manually from the Actions tab (workflow_dispatch), or
# re-enable push/pull_request triggers when you want CI coverage again.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sanitizers:
    name: ASan+UBSan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04 removed: under RelWithDebInfo + ASan + UBSan the four
        # print.process()-heavy fff_print tests (init_print, Extrusion width,
        # Model construction, Perimeter generation) hang for the full 1h
        # per-test timeout each (>6h total) on GCC 13, while passing in ~0.6s
        # on 22.04's GCC 11. Re-add when switching to clang or upstream fixes
        # the instrumentation slowdown.
        os: [ubuntu-22.04]
    env:
      # detect_leaks=0: LeakSanitizer is disabled. The test binaries set
      # program-lifetime globals (e.g. Slic3r::set_resources_dir() at
      # src/libslic3r/utils.cpp:222, called from the TestFrameworkBootstrap
      # Catch2 listener in tests/catch_main.hpp) that LSan flags as leaks.
      # Those reports make catch_discover_tests' build-time test enumeration
      # exit non-zero (failing the build) AND fail every test process at exit.
      # They are false positives (intentional program-lifetime state), not
      # real leaks.
      # ASan (heap/stack memory errors) and UBSan (undefined behavior) — the
      # critical detections — remain fully active. Leak detection can be
      # re-enabled later with a curated LSAN_OPTIONS suppression file.
      ASAN_OPTIONS: detect_leaks=0:strict_string_checks=1:detect_stack_use_after_return=1:detect_container_overflow=1:symbolize=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: "true"

      - name: Restore deps tarball
        id: cache_deps
        uses: actions/cache@v4
        with:
          # Cache a SINGLE zstd tarball instead of the multi-million-file
          # destdir tree (archiving the raw OCCT/OpenCV/boost headers never
          # completed, so deps rebuilt every run). A single tarball restores/
          # saves reliably; the key is repo-scoped and shared with the
          # test-linux / coverage workflows (first to build serves the rest).
          path: ${{ github.workspace }}/deps-destdir.tar.zst
          key: ${{ matrix.os }}-deps-tarball-${{ hashFiles('deps/CMakeLists.txt', 'deps/*.cmake', 'deps/*/*.cmake', 'deps/*/*.patch', 'build_linux.sh') }}

      - uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.28.0"

      - name: Setup swap (sanitizer builds need extra memory)
        shell: bash
        run: |
          SWAPFILE="/swapfile-$$"
          sudo swapoff "$SWAPFILE" 2>/dev/null || true
          sudo rm -f "$SWAPFILE"
          sudo fallocate -l 8G "$SWAPFILE"
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          # Clean up stale swap from previous runs on reused runners
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake git g++ build-essential libgl1-mesa-dev m4 \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules pkgconf \
            libglu1-mesa-dev libcairo2-dev libgtk-3-dev libsoup2.4-dev libwebkit2gtk-4.1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-good1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-bad wget sudo autoconf curl libunwind-dev texinfo llvm ccache libblosc-dev

      - name: Resolve llvm-symbolizer path
        # ASan/UBSan need llvm-symbolizer to produce human-readable stack
        # traces. Resolve it dynamically instead of hardcoding /usr/bin/...,
        # which may not match the installed llvm package layout.
        shell: bash
        run: |
          SYM="$(command -v llvm-symbolizer || true)"
          [ -n "$SYM" ] || SYM="/usr/bin/llvm-symbolizer"
          echo "ASAN_SYMBOLIZER_PATH=$SYM" >> "$GITHUB_ENV"
          echo "UBSAN_SYMBOLIZER_PATH=$SYM" >> "$GITHUB_ENV"
          echo "Resolved llvm-symbolizer: $SYM"

      - name: Install dependencies from build_linux.sh
        shell: bash
        run: sudo ./build_linux.sh -ur

      - name: Fix permissions
        shell: bash
        run: sudo chown $USER -R ./

      - name: Free disk space
        shell: bash
        run: |
          echo "Before cleanup:" && df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules 2>/dev/null || true
          echo "After cleanup:" && df -h /

      - name: Extract deps tarball (cache hit)
        if: steps.cache_deps.outputs.cache-hit == 'true'
        shell: bash
        run: |
          mkdir -p deps/build
          tar --zstd -x -f deps-destdir.tar.zst -C deps/build
          rm -f deps-destdir.tar.zst

      - name: Build dependencies (cache miss)
        if: steps.cache_deps.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p deps/build
          mkdir -p deps/build/destdir
          ./build_linux.sh -dr
          sudo chown $USER -R ./
          # Pack the freshly built destdir into a single tarball for reliable caching.
          tar --zstd -c -f deps-destdir.tar.zst -C deps/build destdir

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: ${{ matrix.os }}-sanitizers
          append-timestamp: false
          restore-keys: |
            ${{ matrix.os }}-release

      - name: Configure CMake with ASan+UBSan
        shell: bash
        run: cmake -S . -B build_san -DCMAKE_BUILD_TYPE=RelWithDebInfo -DENABLE_ASAN=ON -DENABLE_UBSAN=ON -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/deps/build/destdir/usr/local" -DSLIC3R_STATIC=ON -DOPENVDB_USE_STATIC_LIBS=ON -DSLIC3R_GUI=OFF -DBUILD_TESTS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build tests
        id: build-tests
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/deps/build/destdir/usr/local/lib:$LD_LIBRARY_PATH
        run: |
          cmake --build build_san --target tests --parallel $(nproc)
          test -f build_san/tests/libslic3r/libslic3r_tests \
            || test -f build_san/tests/fff_print/fff_print_tests \
            || test -f build_san/tests/libnest2d/libnest2d_tests \
            || { echo "ERROR: No test binaries found in build_san/tests/"; exit 1; }

      - name: Detect changed modules
        id: changed
        uses: tj-actions/changed-files@v46
        with:
          files_yaml: |
            core:
              - src/libslic3r/**
            gui:
              - src/slic3r/**
            cmake:
              - "**/CMakeLists.txt"
              - cmake/**
            test_infra:
              - tests/*.hpp
              - tests/*.cpp
              - tests/data/**
            test_libslic3r:
              - tests/libslic3r/**
            test_fff_print:
              - tests/fff_print/**
            test_sla_print:
              - tests/sla_print/**
            test_slic3rutils:
              - tests/slic3rutils/**
            test_libnest2d:
              - tests/libnest2d/**
            ci_config:
              - .github/workflows/**

      - name: Determine test filter
        id: filter
        shell: bash
        run: |
          if [ "${{ steps.changed.outputs.core_any_changed }}" = "true" ] || \
             [ "${{ steps.changed.outputs.cmake_any_changed }}" = "true" ] || \
             [ "${{ steps.changed.outputs.test_infra_any_changed }}" = "true" ] || \
             [ "${{ steps.changed.outputs.ci_config_any_changed }}" = "true" ]; then
            echo "filter=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changed.outputs.gui_any_changed }}" = "true" ]; then
            echo "filter=slic3rutils" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changed.outputs.test_libslic3r_any_changed }}" = "true" ]; then
            echo "filter=libslic3r" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changed.outputs.test_fff_print_any_changed }}" = "true" ]; then
            echo "filter=fff_print" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changed.outputs.test_sla_print_any_changed }}" = "true" ]; then
            echo "filter=sla_print" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changed.outputs.test_slic3rutils_any_changed }}" = "true" ]; then
            echo "filter=slic3rutils" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.changed.outputs.test_libnest2d_any_changed }}" = "true" ]; then
            echo "filter=libnest2d" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "filter=__SKIP__" >> "$GITHUB_OUTPUT"

      - name: Run tests
        if: success() && steps.filter.outputs.filter != '__SKIP__'
        shell: bash
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/deps/build/destdir/usr/local/lib:$LD_LIBRARY_PATH
        run: |
          if [ -n "${{ steps.filter.outputs.filter }}" ]; then
            ctest --test-dir build_san --output-on-failure --output-junit "${{ github.workspace }}/build_san/test-results.xml" --timeout 3600 -R "${{ steps.filter.outputs.filter }}" -E '\[trace\]'
          else
            ctest --test-dir build_san --output-on-failure --output-junit "${{ github.workspace }}/build_san/test-results.xml" --timeout 3600 -E '\[trace\]'
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-sanitizer-${{ matrix.os }}
          path: build_san/test-results.xml
          if-no-files-found: warn

      - name: Generate HTML report
        if: always()
        shell: bash
        run: node scripts/junit-to-html.js build_san/test-results.xml -t "OrcaSlicer Sanitizer Tests" -o build_san/test-report.html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report-${{ matrix.os }}
          path: build_san/test-report.html
          if-no-files-found: warn
